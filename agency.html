<script>
try{if(window.self!==window.top)document.documentElement.classList.add("embedded");}catch(e){document.documentElement.classList.add("embedded");}
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var toastT;function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("on");},2200);}
function fold(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss");}
function fmt(n){if(n==null)return "";if(n>=1e6)return (n/1e6).toFixed(1).replace(".",",").replace(",0","")+" Mio";if(n>=10000)return Math.round(n/1000)+" Tsd";return n.toLocaleString("de-DE");}
function igUrl(h){return "https://www.instagram.com/"+encodeURIComponent(h)+"/";}

var F=Object.assign({q:"",wer:"alle",typ:"alle",zeit:"7",gruppen:[],top:false,merk:false},load("sb-agency-filter",{}));
var MEIN=load("sb-mit-eigen",{});   /* Stern und Notiz teilen sich Mitbewerber und dieses Sheet, nur im Browser */
var S=load("sb-agency-sort",{k:"akt",r:1});
var DATA=null,AG=[],BY={},view=(location.hash.slice(1)||"jetzt"),TKEY=null,LOCAL=false;

/* ---------- Daten laden ---------- */
function isLocal(){return /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)&&!/[?&]enc=1/.test(location.search);}
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function ableiten(pass,salt,runden){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:runden,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function decrypt(enc,pass){
  var key=await ableiten(pass,b64(enc.salt),enc.runden);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function loadLocal(){
  if(!isLocal())return false;
  try{var r=await fetch("../AgencySheet/daten/agency_daten.json?v="+Date.now());if(!r.ok)return false;DATA=await r.json();LOCAL=true;return true;}catch(e){return false;}
}
function lockScreen(){
  $("#topbar").hidden=true;$("#filters").hidden=true;$("#chips").hidden=true;
  $("#main").innerHTML='<div class="lock"><img src="logo_social_bites.webp" alt="Social Bites" width="900" height="806"><h1>Agency Master Sheet</h1><p>Die Daten sind verschlüsselt. Gib die Passphrase von Nader und Tommy ein, dieselbe wie im Akquise-Board.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase"><div class="err" id="pwErr" role="alert"></div><button class="btn inv" type="button" id="pwGo" style="justify-content:center"><span class="dot"></span><span>Öffnen</span></button></div>';
  var tries=0,wait=0;
  async function go(){
    var p=$("#pw").value;if(!p||Date.now()<wait)return;
    $("#pwErr").textContent="";$("#pwGo").disabled=true;
    try{DATA=await decrypt(window.AGENCY_ENC,p);try{localStorage.setItem("akq-pw",p);sessionStorage.setItem("akq-pw",p);}catch(e){}bildKey(p);start();}
    catch(e){tries++;$("#pwErr").textContent=tries>=5?"Zu viele Versuche, 30 Sekunden Pause.":"Falsche Passphrase.";if(tries>=5){wait=Date.now()+30000;tries=0;}$("#pwGo").disabled=false;$("#pw").select();}
  }
  $("#pwGo").addEventListener("click",go);$("#pw").addEventListener("keydown",function(e){if(e.key==="Enter")go();});
  setTimeout(function(){var i=$("#pw");if(i)i.focus();},50);
}
function bildKey(p){var e=window.AGENCY_ENC;TKEY=ableiten(p,new TextEncoder().encode(e.bild_salt),e.runden);}
async function boot(){
  if(await loadLocal())return start();
  if(!window.AGENCY_ENC){$("#main").innerHTML='<div class="lock"><h1>Noch keine Daten</h1><p>Der erste Abruf läuft noch nicht auf GitHub. Lokal: AgencySheet/holen.py, dann AgencySheet/bauen.py.</p></div>';return;}
  var saved="";try{saved=localStorage.getItem("akq-pw")||sessionStorage.getItem("akq-pw")||"";}catch(e){}
  if(saved){try{DATA=await decrypt(window.AGENCY_ENC,saved);bildKey(saved);return start();}catch(e){}}
  lockScreen();
}

/* ---------- Bilder, erst in Sichtweite ---------- */
var HAT=new Set();
var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);bild(e.target);}});},{rootMargin:"500px"}):null;
async function bild(el){
  var c=el.getAttribute("data-code");if(!c||!HAT.has(c))return;
  try{
    var src;
    if(LOCAL)src="../AgencySheet/daten/thumbs/"+encodeURIComponent(c)+".webp";
    else{
      var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(c));
      var name=Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,"0");}).join("").slice(0,16);
      var r=await fetch("akquise/agency/"+name+".enc");if(!r.ok)return;
      var buf=new Uint8Array(await r.arrayBuffer());
      var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(4,16)},await TKEY,buf.slice(16));
      src=URL.createObjectURL(new Blob([pt],{type:"image/webp"}));
    }
    var i=new Image();i.alt="";i.decoding="async";i.src=src;i.onload=function(){el.textContent="";el.appendChild(i);};
  }catch(e){}
}
function bilderBeobachten(root){(root||document).querySelectorAll("[data-code]").forEach(function(el){if(io)io.observe(el);else bild(el);});}

/* ---------- Helfer ---------- */
var STUFE={heute:"Heute aktiv",woche:"Diese Woche",monat:"Diesen Monat",ruhig:"Ruhig",unbekannt:"Keine Daten"};
var TYP={reel:"Reel",karussell:"Karussell",foto:"Foto"};
var ROLLE={agentur:"Agentur",kunde:"Kunde",inspo:"Inspo"};
function mein(id){return MEIN[id]||{};}
function setMein(id,k,v){var m=MEIN[id]||{};m[k]=v;if(!m.s&&!m.n)delete MEIN[id];else MEIN[id]=m;store("sb-mit-eigen",MEIN);}
function alter(ts){if(!ts)return "";var s=Date.now()/1000-ts;if(s<3600)return "vor "+Math.max(1,Math.round(s/60))+" Min";if(s<86400)return "vor "+Math.round(s/3600)+" Std";var t=Math.round(s/86400);if(t<60)return "vor "+t+(t===1?" Tag":" Tagen");return "vor "+Math.round(t/30)+" Monaten";}
function datum(ts){return new Date(ts*1000).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}
function letzte(a){return Math.max(a.kz.letzter||0,a.letzter_kunde||0)||null;}
function stufe(ts){if(!ts)return "unbekannt";var t=(Date.now()/1000-ts)/86400;return t<1.5?"heute":t<7?"woche":t<30?"monat":"ruhig";}
function aktivitaet(a){return (a.kz.p7||0)*2+(a.kunden_posts7||0);}
function okGr(a,skip){return !(skip!=="gruppen"&&F.gruppen.length&&F.gruppen.indexOf(a.gruppe)<0);}
function okA(a,skip){
  if(!okGr(a,skip))return false;
  if(F.top&&!a.prio)return false;
  if(F.merk&&!mein(a.id).s)return false;
  return true;
}
function hayA(a){return fold([a.name,a.handle,a.bio,a.notiz,a.tags.join(" "),a.kunden.map(function(k){return k.handle;}).join(" "),mein(a.id).n].join(" "));}
function treffer(h){return !F.q||!F.q.split(/\s+/).some(function(w){return w&&h.indexOf(w)<0;});}
function saveF(){store("sb-agency-filter",F);}

/* ---------- Filter ---------- */
function buildFilters(){
  var feed=view==="jetzt";
  $("#filters").innerHTML='<input type="search" id="fq" placeholder="'+(feed?"Suche: Konto, Caption":"Suche: Agentur, Kunde, Bio")+'" aria-label="Suche">'+
    (feed?'<select id="fwer" aria-label="Wer"><option value="alle">Agenturen und Kunden</option><option value="agentur">Nur Agenturen selbst</option><option value="kunde">Nur Kunden</option><option value="inspo">Nur Inspo</option></select>'+
    '<select id="ftyp" aria-label="Format"><option value="alle">Alle Formate</option><option value="reel">Reels</option><option value="karussell">Karussells</option><option value="foto">Fotos</option></select>'+
    '<select id="fzeit" aria-label="Zeitraum"><option value="1">Letzte 24 Stunden</option><option value="7">Letzte 7 Tage</option><option value="30">Letzte 30 Tage</option><option value="alle">Alles</option></select>':"")+
    '<label class="chk"><input type="checkbox" id="ftop">nur markierte</label><label class="chk"><input type="checkbox" id="fmerk">nur gemerkte</label>'+
    '<span style="flex:1"></span><a class="btn sm inv" href="'+esc(DATA.doc_url)+'" target="_blank" rel="noopener"><span class="dot"></span><span>Doc öffnen ↗</span></a>';
  $("#fq").value=F.qr||"";$("#ftop").checked=!!F.top;$("#fmerk").checked=!!F.merk;
  if(feed){$("#fwer").value=F.wer;$("#ftyp").value=F.typ;$("#fzeit").value=F.zeit;}
}
function drawChips(){
  var c={};AG.filter(function(a){return okA(a,"gruppen");}).forEach(function(a){c[a.gruppe]=(c[a.gruppe]||0)+1;});
  $("#chips").innerHTML=Object.keys(DATA.gruppen).map(function(g){return '<button class="gchip" type="button" data-gr="'+g+'" aria-pressed="'+(F.gruppen.indexOf(g)>-1)+'">'+esc(DATA.gruppen[g])+'<i>'+(c[g]||0)+'</i></button>';}).join("");
}

/* ---------- Ansichten ---------- */
var VIEWS=[["jetzt","Jetzt"],["sheet","Sheet"],["lernen","Lernen"],["pruefen","Konten prüfen"]];
function pruefListe(){return AG.filter(function(a){return !a.konto_ok&&a.gruppe!=="inspo";});}
function drawViews(){
  $("#views").innerHTML=VIEWS.map(function(v){var n=v[0]==="pruefen"?'<span class="n">'+pruefListe().length+'</span>':"";return '<button type="button" data-view="'+v[0]+'" aria-pressed="'+(view===v[0])+'">'+v[1]+n+'</button>';}).join("");
}
function render(){
  var fb=view==="jetzt"||view==="sheet";
  $("#filters").hidden=!fb;$("#chips").hidden=!fb;
  if(fb){buildFilters();drawChips();}
  drawViews();
  $("#main").innerHTML=view==="sheet"?vSheet():view==="lernen"?vLernen():view==="pruefen"?vPruefen():vJetzt();
  bilderBeobachten($("#main"));
  try{history.replaceState(null,"","#"+view);}catch(e){}
}
function renderMain(){
  if(view==="jetzt"||view==="sheet")drawChips();
  $("#main").innerHTML=view==="sheet"?vSheet():vJetzt();
  bilderBeobachten($("#main"));
}
function postKarte(p){
  var a=BY[p.ag],neu=(Date.now()/1000-p.ts)<86400*1.5;
  var zl=[];if(p.likes!=null)zl.push("♥ "+fmt(p.likes));if(p.kommentare!=null)zl.push("✎ "+fmt(p.kommentare));if(p.views)zl.push("▶ "+fmt(p.views));if(p.faktor>=2)zl.push(String(p.faktor).replace(".",",")+"× Schnitt");
  return '<article class="pc"><a class="bild" href="'+esc(p.url)+'" target="_blank" rel="noopener" aria-label="Post von @'+esc(p.handle)+' auf Instagram öffnen"><span class="lz" data-code="'+esc(p.code)+'">'+esc(TYP[p.typ])+'</span><span class="tp">'+esc(TYP[p.typ])+'</span>'+(neu?'<span class="nw">Neu</span>':"")+'</a>'+
    '<div class="tx"><div class="wer">@'+esc(p.handle)+'</div>'+
    (a?'<button class="ag" type="button" data-det="'+esc(a.id)+'">'+esc(p.rolle==="kunde"?"Kunde von "+a.name:ROLLE[p.rolle])+'</button>':"")+
    (p.cap?'<div class="cap">'+esc(p.cap)+'</div>':"")+
    '<div class="zl"><span title="'+esc(datum(p.ts))+'">'+esc(alter(p.ts))+'</span>'+zl.map(function(z){return "<span>"+esc(z)+"</span>";}).join("")+'</div></div></article>';
}
function feedListe(){
  var jetzt=Date.now()/1000,lim=F.zeit==="alle"?1e12:(+F.zeit)*86400;
  return DATA.posts.filter(function(p){
    var a=BY[p.ag];if(!a||!okA(a))return false;
    if(F.wer!=="alle"&&p.rolle!==F.wer)return false;
    if(F.typ!=="alle"&&p.typ!==F.typ)return false;
    if(jetzt-p.ts>lim)return false;
    return treffer(fold(p.handle+" "+p.owner+" "+p.cap+" "+a.name));
  });
}
function vJetzt(){
  var jetzt=Date.now()/1000,p24=DATA.posts.filter(function(p){return jetzt-p.ts<86400;}).length,p7=DATA.posts.filter(function(p){return jetzt-p.ts<7*86400;}).length;
  var aktiv=AG.filter(function(a){return a.gruppe!=="inspo"&&letzte(a)&&jetzt-letzte(a)<7*86400;}).length;
  var l=feedListe();
  var h='<h1 class="h2">Was die Agenturen gerade machen.</h1><p class="lead">Die neuesten Posts der Agenturen und ihrer Kunden aus unserer Inspiration Library, neueste zuerst. Ein Klick aufs Bild öffnet den Post, ein Klick auf den Namen die Agentur.</p>';
  h+='<div class="stats"><div class="stat"><span class="mono">Posts 24 Std</span><b>'+p24+'</b></div><div class="stat"><span class="mono">Posts 7 Tage</span><b>'+p7+'</b></div><div class="stat"><span class="mono">Agenturen aktiv 7 Tage</span><b>'+aktiv+'</b></div><div class="stat"><span class="mono">Letzter Abruf</span><b style="font-size:18px">'+esc(DATA.stand)+'</b></div></div>';
  var top=AG.filter(function(a){return a.gruppe!=="inspo"&&aktivitaet(a)>0;}).sort(function(a,b){return aktivitaet(b)-aktivitaet(a);}).slice(0,6);
  if(top.length)h+='<h2 class="bl">Diese Woche am aktivsten</h2><div class="aktiv-top">'+top.map(function(a){return '<button type="button" data-det="'+esc(a.id)+'"><b>'+esc(a.name)+'</b><em>'+((a.kz.p7||0)+(a.kunden_posts7||0))+'</em><small>'+(a.kz.p7||0)+' eigene, '+(a.kunden_posts7||0)+' bei Kunden</small></button>';}).join("")+'</div>';
  h+='<h2 class="bl">Neueste Posts <span class="mono" style="font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--mute)">'+l.length+'</span></h2>';
  if(!l.length)return h+'<div class="empty"><b>Keine Posts mit diesen Filtern.</b> Zeitraum vergrößern oder Filter lösen.</div>';
  return h+'<div class="feed">'+l.slice(0,240).map(postKarte).join("")+'</div>'+(l.length>240?'<p class="hinweis">Die ersten 240 von '+l.length+' Posts. Filter engt die Liste ein.</p>':"")+hinweisGrenzen();
}
function hinweisGrenzen(){return '<p class="hinweis">Quelle: öffentliche Instagram Profile, ohne Login. Pro Abruf sind die 12 neuesten Posts sichtbar, alles Ältere sammelt das Sheet mit jedem Lauf. Views gibt Instagram ausgeloggt nicht heraus, Likes und Kommentare nur bei Reels. Zahlen bis zu 7 Tage alt.</p>';}

var SP=[["akt","Aktivität",""],["letzt","Letzter Post",""],["p7","Posts 7T",""],["p30","Posts 30T",""],["fol","Follower",""],["dfol","+7T","opt"],["kund","Kunden aktiv",""],["kp7","Kunden Posts 7T","opt"],["reel","Reels %","opt"],["likes","Likes Mitte","opt"]];
function sortWert(a,k){
  if(k==="name")return fold(a.name);
  if(k==="akt")return aktivitaet(a);if(k==="letzt")return letzte(a)||0;if(k==="p7")return a.kz.p7||0;if(k==="p30")return a.kz.p30||0;
  if(k==="fol")return a.follower||0;if(k==="dfol")return a.wachstum?a.wachstum.delta:-1e12;if(k==="kund")return a.kunden_aktiv7||0;if(k==="kp7")return a.kunden_posts7||0;
  if(k==="reel")return reelAnt(a)==null?-1:reelAnt(a);if(k==="likes")return a.kz.likes_median||0;return 0;
}
function reelAnt(a){var m=a.kz.mix||{},s=(m.reel||0)+(m.karussell||0)+(m.foto||0);return s?Math.round(100*(m.reel||0)/s):null;}
function vSheet(){
  var l=AG.filter(function(a){return okA(a)&&treffer(hayA(a));});
  l.sort(function(a,b){var x=sortWert(a,S.k),y=sortWert(b,S.k);var d=x<y?1:x>y?-1:0;if(S.k==="name")d=-d;return (S.r?d:-d)||(sortWert(b,"letzt")-sortWert(a,"letzt"));});
  var h='<h1 class="h2">Agency Master Sheet.</h1><p class="lead">Jede Agentur eine Zeile. Sortieren per Klick auf die Spalte, Klick auf die Zeile öffnet alle Posts und Kunden. Die Aktivität zählt eigene Posts doppelt und Kunden Posts einfach, jeweils aus den letzten 7 Tagen.</p>';
  if(!l.length)return h+'<div class="empty"><b>Keine Agentur mit diesen Filtern.</b></div>';
  var th=function(k,lb,cl,left){var on=S.k===k;return '<th class="'+(left?"l ":"")+(cl||"")+'"'+(on?' aria-sort="'+(S.r?"descending":"ascending")+'"':"")+'><button type="button" data-sort="'+k+'">'+esc(lb)+(on?(S.r?" ↓":" ↑"):"")+'</button></th>';};
  h+='<div class="sheet-wrap"><table class="sheet"><thead><tr>'+th("name","Agentur","",true)+'<th class="l">Status</th>'+SP.map(function(s){return th(s[0],s[1],s[2]);}).join("")+'</tr></thead><tbody>';
  h+=l.map(function(a){
    var ts=letzte(a),st=stufe(ts),w=a.wachstum,r=reelAnt(a);
    var sub=a.handle?"@"+a.handle:"kein Instagram";
    return '<tr data-det="'+esc(a.id)+'" tabindex="0" class="'+(a.prio==="top"?"topz":"")+'"><td class="l nm">'+(mein(a.id).s?"★ ":"")+esc(a.name)+'<small class="'+(a.konto_ok?"":"warn")+'">'+esc(sub)+(a.konto_ok?"":" · prüfen")+'</small></td>'+
      '<td class="l"><span class="st '+st+'">'+esc(STUFE[st])+'</span></td>'+
      '<td>'+(aktivitaet(a)||'<span class="dim">0</span>')+'</td>'+
      '<td title="'+(ts?esc(datum(ts)):"")+'">'+(ts?esc(alter(ts)):'<span class="dim">offen</span>')+'</td>'+
      '<td>'+(a.konto_ok?a.kz.p7:'<span class="dim">offen</span>')+'</td>'+
      '<td>'+(a.konto_ok?(a.kz.p30+(a.kz.voll?"+":"")):'<span class="dim">offen</span>')+'</td>'+
      '<td>'+(a.konto_ok&&a.follower!=null?esc(fmt(a.follower)):'<span class="dim">offen</span>')+'</td>'+
      '<td class="opt">'+(w?(w.delta>=0?'<span class="pl">+'+w.delta.toLocaleString("de-DE")+'</span>':'<span class="mn">'+w.delta.toLocaleString("de-DE")+'</span>'):'<span class="dim">ab Tag 2</span>')+'</td>'+
      '<td>'+(a.kunden.length?a.kunden_aktiv7+" von "+a.kunden.length:'<span class="dim">keine</span>')+'</td>'+
      '<td class="opt">'+(a.kunden.length?a.kunden_posts7:'<span class="dim">keine</span>')+'</td>'+
      '<td class="opt">'+(r==null?'<span class="dim">offen</span>':r)+'</td>'+
      '<td class="opt">'+(a.kz.likes_median!=null?esc(fmt(a.kz.likes_median)):'<span class="dim">offen</span>')+'</td></tr>';
  }).join("");
  return h+'</tbody></table></div>'+hinweisGrenzen();
}
function bar(lb,n,max,txt){return '<div class="bar"><span>'+esc(lb)+'</span><i style="width:'+(max?Math.max(2,100*n/max):0)+'%"></i><span>'+esc(txt)+'</span></div>';}
function vLernen(){
  var L=DATA.lernen||{},h='<h1 class="h2">Was wir daraus lernen.</h1><p class="lead">Das Sheet wertet nach jedem Lauf alle Posts der geprüften Agenturen aus und merkt sich den Verlauf. Stichprobe gerade: '+(L.n_posts||0)+' Posts von '+(L.n_konten||0)+' Agenturen aus 60 Tagen, '+(DATA.messtage||0)+' Messtag'+(DATA.messtage===1?"":"e")+'. Je länger es läuft, desto belastbarer wird es.</p>';
  h+='<div class="lgrid">';
  (L.saetze||[]).forEach(function(s){h+='<section class="lernk"><div class="lsatz">'+esc(s.t)+'</div><div class="lbel">'+esc(s.b)+'</div></section>';});
  if(!(L.saetze||[]).length)h+='<section class="lernk"><div class="lsatz">Noch zu wenig Daten für Aussagen.</div><div class="lbel">Lernsätze erscheinen erst ab 30 Posts.</div></section>';
  h+='</div>';
  var ub=(L.ueberflieger||[]).map(function(c){return DATA.posts.find(function(p){return p.code===c;});}).filter(Boolean);
  h+='<h2 class="bl">Überflieger</h2><p class="hinweis" style="margin:0 0 10px">Reels mit mindestens doppelt so vielen Likes wie der Kontoschnitt, also gemessen am eigenen Konto und nicht an der Größe.</p>';
  h+=ub.length?'<div class="feed" style="margin-bottom:24px">'+ub.map(postKarte).join("")+'</div>':'<div class="empty" style="margin-bottom:24px"><b>Noch keine.</b> Dafür braucht ein Konto mindestens 3 gemessene Reels.</div>';
  h+='<div class="lgrid">';
  if(L.mix){var mm=Math.max.apply(null,L.mix.map(function(m){return m.n;}));h+='<section class="lernk"><h3>Format Mix</h3>'+L.mix.map(function(m){return bar(TYP[m.typ],m.n,mm,m.anteil+" %");}).join("")+'</section>';}
  if(L.wochentage){var mw=Math.max.apply(null,L.wochentage.map(function(m){return m.n;}));h+='<section class="lernk"><h3>Wochentag</h3>'+L.wochentage.map(function(m){return bar(m.tag,m.n,mw,m.n);}).join("")+'</section>';}
  if(L.stunden){var ms=Math.max.apply(null,L.stunden.map(function(m){return m.n;}));h+='<section class="lernk"><h3>Uhrzeit</h3><div class="h24" role="img" aria-label="Posts je Stunde">'+L.stunden.map(function(m){return '<i title="'+m.h+' Uhr: '+m.n+' Posts" style="height:'+(ms?Math.max(3,100*m.n/ms):0)+'%"></i>';}).join("")+'</div><div class="h24l"><span>0</span><span>6</span><span>12</span><span>18</span><span>23 Uhr</span></div></section>';}
  if(L.formate){h+='<section class="lernk"><h3>Caption Muster</h3>'+L.formate.map(function(f){return bar(f.name,f.anteil,100,f.anteil+" %");}).join("")+'<div class="lbel">Nur Caption, der Text im Video ist nicht auslesbar.</div></section>';}
  if((L.hashtags||[]).length)h+='<section class="lernk"><h3>Häufigste Hashtags</h3><div class="tagw">'+L.hashtags.map(function(t){return '<span>#'+esc(t.t)+'<b>'+t.n+'</b></span>';}).join("")+'</div></section>';
  if((L.worte||[]).length)h+='<section class="lernk"><h3>Häufigste Wörter</h3><div class="tagw">'+L.worte.map(function(t){return '<span>'+esc(t.t)+'<b>'+t.n+'</b></span>';}).join("")+'</div></section>';
  h+='</div>';
  h+='<div class="lgrid"><section class="lernk"><h3>Vielleicht neue Kunden</h3><div class="lbel">Konten, die Agenturen in Captions markieren oder als Kooperation posten und die noch nicht im Doc stehen. Markiert heißt nicht automatisch Kunde.</div>';
  var en=L.entdeckt||[];h+=en.length?en.slice(0,20).map(function(e){return '<div class="ent"><a href="'+esc(igUrl(e.handle))+'" target="_blank" rel="noopener">@'+esc(e.handle)+'</a><span class="mono" style="font-size:11px">'+e.n+'×</span><small>bei '+e.von.map(function(v){return "@"+esc(v);}).join(", ")+'</small></div>';}).join(""):'<div class="lbel">Noch nichts gefunden.</div>';
  h+='</section><section class="lernk"><h3>Erkenntnisse aus dem Doc</h3>'+DATA.erkenntnisse.map(function(e,i){return '<div class="rule"><i>'+(i+1)+'</i><div><b>'+esc(e.thema)+'</b>'+esc(e.text)+'</div></div>';}).join("")+'<a class="btn sm" href="'+esc(DATA.doc_url)+'" target="_blank" rel="noopener"><span class="dot"></span><span>Beispielbilder im Doc ↗</span></a></section>';
  h+='<section class="lernk"><h3>Best Videos aus dem Doc</h3><div class="lbel">'+esc(DATA.best_intro)+'</div><div class="vlist">'+DATA.best_videos.map(function(u,i){return '<a class="btn sm" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="dot"></span><span>Reel '+(i+1)+' ↗</span></a>';}).join("")+'</div></section></div>';
  return h;
}
function vPruefen(){
  var l=pruefListe(),h='<h1 class="h2">Konten prüfen.</h1><p class="lead">Hier trifft der Name aus dem Doc kein passendes Instagram Konto, oder im Doc steht keins. Diese Agenturen zählen nicht in die Auswertung, ihre Kunden werden trotzdem beobachtet. Den richtigen Handle kurz nennen, dann läuft die Agentur ab dem nächsten Abruf mit.</p>';

    var q=a.web?'<a href="'+esc(a.web)+'" target="_blank" rel="noopener">Website ↗</a> ':"";

  return h;
}

/* ---------- Detail ---------- */
var aktId=null;
function detail(id){
  var a=BY[id];if(!a)return;aktId=id;
  var m=mein(id),ts=letzte(a),st=stufe(ts);
  var own=DATA.posts.filter(function(p){return p.ag===id&&(p.rolle==="agentur"||p.rolle==="inspo");});
  var kp=DATA.posts.filter(function(p){return p.ag===id&&p.rolle==="kunde";}).slice(0,24);
  var lk=(a.handle?'<a class="btn sm inv" href="'+esc(igUrl(a.handle))+'" target="_blank" rel="noopener"><span class="dot"></span><span>Instagram ↗</span></a>':"")+(a.web?'<a class="btn sm" href="'+esc(a.web)+'" target="_blank" rel="noopener"><span class="dot"></span><span>Website ↗</span></a>':"")+(a.ext&&a.ext!==a.web?'<a class="btn sm" href="'+esc(a.ext)+'" target="_blank" rel="noopener"><span class="dot"></span><span>Bio Link ↗</span></a>':"")+a.links.map(function(l){return '<a class="btn sm" href="'+esc(l[1])+'" target="_blank" rel="noopener"><span class="dot"></span><span>'+esc(l[0])+' ↗</span></a>';}).join("");
  var h='<div class="kopf"><div><h2 id="detT">'+esc(a.name)+'</h2><div style="margin-top:7px"><span class="st '+st+'">'+esc(STUFE[st])+(ts?", "+esc(alter(ts)):"")+'</span></div></div><button class="fav" type="button" data-star="'+esc(id)+'" aria-pressed="'+(!!m.s)+'" aria-label="Merken">★</button><button class="x" type="button" data-close aria-label="Schließen">✕</button></div><div class="in">';
  if(!a.konto_ok)h+='<div class="warnbox"><b>Konto prüfen.</b> '+esc(a.konto_grund)+(a.handle?" (@"+esc(a.handle)+")":"")+'. Eigene Zahlen fehlen deshalb, Kunden laufen trotzdem.</div>';
  h+='<div class="stats" style="margin:0"><div class="stat"><span class="mono">Follower</span><b>'+(a.konto_ok&&a.follower!=null?esc(fmt(a.follower)):"offen")+'</b></div><div class="stat"><span class="mono">Posts 7 Tage</span><b>'+(a.konto_ok?a.kz.p7:"offen")+'</b></div><div class="stat"><span class="mono">Posts 30 Tage</span><b>'+(a.konto_ok?a.kz.p30+(a.kz.voll?"+":""):"offen")+'</b></div><div class="stat"><span class="mono">Kunden aktiv 7T</span><b>'+a.kunden_aktiv7+" / "+a.kunden.length+'</b></div></div>';
  if(a.konto_ok&&a.bio)h+='<div class="bio">'+esc(a.bio)+'</div>';
  if(a.preis)h+='<div class="warnbox"><b>Preis laut Doc:</b> '+esc(a.preis)+'</div>';
  if(a.notiz)h+='<p class="hinweis" style="margin:0"><b>Aus dem Doc:</b> '+esc(a.notiz)+'</p>';
  if(lk)h+='<div class="lk">'+lk+'</div>';
  if(own.length)h+='<section><h3>Neueste eigene Posts</h3><div class="feed">'+own.slice(0,12).map(postKarte).join("")+'</div></section>';
  if(a.kunden.length){
    var ks=a.kunden.slice().sort(function(x,y){return (y.kz.letzter||0)-(x.kz.letzter||0);});
    h+='<section><h3>Kunden laut Doc</h3><div style="overflow:auto"><table class="kl"><tbody>'+ks.map(function(k){var s=stufe(k.kz.letzter);return '<tr><td><a href="'+esc(igUrl(k.handle))+'" target="_blank" rel="noopener">@'+esc(k.handle)+'</a></td><td><span class="st '+s+'">'+(k.status==="fehlt"?"Nicht verfügbar":esc(k.kz.letzter?alter(k.kz.letzter):STUFE[s]))+'</span></td><td>'+k.kz.p7+' in 7T</td><td>'+(k.follower!=null?esc(fmt(k.follower)):"")+'</td></tr>';}).join("")+'</tbody></table></div></section>';
    if(kp.length)h+='<section><h3>Neueste Posts bei Kunden</h3><div class="feed">'+kp.map(postKarte).join("")+'</div></section>';
  }
  h+='<section><h3>Eigene Notiz</h3><textarea data-note="'+esc(id)+'" placeholder="Was fällt uns auf? Preise, Stärken, Schwächen, was wir übernehmen wollen">'+esc(m.n||"")+'</textarea></section></div>';
  var d=$("#det");d.innerHTML=h;if(!d.open)d.showModal();d.scrollTop=0;bilderBeobachten(d);
}

/* ---------- Start ---------- */
function start(){
  AG=DATA.agenturen||[];BY={};AG.forEach(function(a){BY[a.id]=a;});HAT=new Set(DATA.hat_bild||[]);
  $("#topbar").hidden=false;
  $("#stand").textContent=AG.length+" Agenturen · "+DATA.posts.length+" Posts · Stand "+DATA.stand;
  render();
}

/* ---------- Eingaben ---------- */
var qT,nT;
document.addEventListener("input",function(e){
  if(e.target.id==="fq"){clearTimeout(qT);var v=e.target.value;qT=setTimeout(function(){F.qr=v;F.q=fold(v).trim();saveF();renderMain();},180);}
  else if(e.target.hasAttribute("data-note")){var id=e.target.getAttribute("data-note"),val=e.target.value;clearTimeout(nT);nT=setTimeout(function(){setMein(id,"n",val.trim());},350);}
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="ftop")F.top=e.target.checked;else if(id==="fmerk")F.merk=e.target.checked;else if(id==="fwer")F.wer=e.target.value;else if(id==="ftyp")F.typ=e.target.value;else if(id==="fzeit")F.zeit=e.target.value;else return;
  saveF();renderMain();
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr[data-det]")){e.preventDefault();detail(e.target.getAttribute("data-det"));}
});
document.addEventListener("click",function(e){
  var d=$("#det");if(e.target===d){d.close();return;}
  var t=e.target.closest("[data-view],[data-gr],[data-star],[data-det],[data-sort],[data-close]");if(!t)return;
  if(t.hasAttribute("data-close")){d.close();return;}
  if(t.hasAttribute("data-view")){view=t.getAttribute("data-view");render();window.scrollTo(0,0);return;}
  if(t.hasAttribute("data-gr")){var g=t.getAttribute("data-gr"),i=F.gruppen.indexOf(g);if(i>-1)F.gruppen.splice(i,1);else F.gruppen.push(g);saveF();renderMain();return;}
  if(t.hasAttribute("data-star")){var s=t.getAttribute("data-star"),on=!mein(s).s;setMein(s,"s",on);t.setAttribute("aria-pressed",on);toast(on?"Gemerkt":"Nicht mehr gemerkt");return;}
  if(t.hasAttribute("data-sort")){var k=t.getAttribute("data-sort");if(S.k===k)S.r=S.r?0:1;else{S.k=k;S.r=k==="name"?0:1;}store("sb-agency-sort",S);renderMain();return;}
  if(t.hasAttribute("data-det")){detail(t.getAttribute("data-det"));return;}
});
boot();
})();
</script>
