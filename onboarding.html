<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onboarding · Social Bites</title>
<meta name="description" content="Internes Onboarding von Social Bites: vom Ja zum Start in fünf Minuten.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FEFEFE">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" as="font" type="font/woff2" href="fonts/crew/inter-tight.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/crew/schibsted-grotesk.woff2" crossorigin>
<style>
  /* Onboarding: fünf Schritte vom Ja zum Start. Alle Klassen tragen das Präfix ob, weil theme.css und glass.css viele kurze Namen belegen.
     Inhalte aus dem Sheet "Nader x Tommy OS", Tab ONBOARD, stehen unten im Skript in FRAGEN, GESPRAECH, VORBEREITUNG, BRANCHEN, INFLUENCER, INTERN.
     Termine stammen aus dem Playbook (Onboarding/index.html). Kundendaten liegen nur im Browser (localStorage sb-onboarding-v1), nie im Code. */
  @font-face{font-family:"Inter Tight";src:url(fonts/crew/inter-tight.woff2) format("woff2");font-weight:100 900;font-display:swap;}
  @font-face{font-family:"Schibsted Grotesk";src:url(fonts/crew/schibsted-grotesk.woff2) format("woff2");font-weight:400 900;font-display:swap;}
  :root{
    --paper:#FEFEFE;--paper-2:#E3EAE0;--card:#FFFFFF;--ink:#232321;--mute:#6C6F68;
    --line:rgba(35,35,33,.14);--line-2:rgba(35,35,33,.3);
    --accent:#F26A21;--accent-ink:#C4490F;--accent-tint:#FDE3D2;--ok:#1F7A4D;--bad:#B42318;
    --display:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --body:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
    --pad:clamp(14px,2.4vw,30px);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;}
  button,input,textarea,select{font:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;}
  h1,h2,h3,p{margin:0;}
  [hidden]{display:none !important;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;line-height:1.1;text-decoration:none;white-space:nowrap;}
  .btn.inv{background:#232321;color:#FEFEFE;}
  .btn.sm{min-height:34px;padding:7px 13px;font-size:13px;}
  .btn.lg{min-height:48px;padding:12px 22px;font-size:15px;}
  .btn:disabled{opacity:.45;cursor:default;}
  .ob-link{border:0;background:none;padding:0;color:var(--mute);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);}
  .ob-link:hover{color:var(--ink);}
  .ob-eyebrow{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);}

  html.sbg .ob-new input,html.sbg .ob-addchip{border-radius:999px !important;}

  /* Start */
  .ob-home{max-width:1040px;margin:0 auto;padding:clamp(26px,5vw,60px) var(--pad) 48px;}
  .ob-hero h1{font:700 clamp(38px,6.2vw,72px)/.94 var(--display);letter-spacing:-.045em;margin:10px 0 14px;max-width:13em;}
  .ob-hero h1 em{font-style:normal;color:var(--accent);}
  .ob-hero p{color:var(--mute);font-size:17px;max-width:36em;}
  .ob-new{display:flex;gap:8px;margin-top:24px;max-width:560px;}
  .ob-new input{flex:1;min-width:0;height:54px;padding:0 20px;font-size:17px;font-weight:550;border-radius:999px !important;}
  .ob-new .btn{height:54px;padding:0 24px;font-size:15px;}
  .ob-note{margin-top:10px;font-size:13px;color:var(--mute);}
  .ob-sec{margin-top:clamp(30px,5vw,48px);}
  .ob-sec>.ob-eyebrow{display:block;margin-bottom:10px;}
  .ob-rows{display:grid;gap:8px;}
  .ob-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto minmax(0,1.3fr);align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;border-radius:18px;border:1px solid var(--g-glass-line,var(--line));background:var(--g-glass,var(--card));box-shadow:var(--g-shadow,none);-webkit-backdrop-filter:var(--g-blur,none);backdrop-filter:var(--g-blur,none);transition:transform .25s var(--ease),box-shadow .25s ease;}
  .ob-row:hover{transform:translateY(-1px);box-shadow:var(--g-shadow-lg,none);}
  .ob-row b{font:650 17px/1.15 var(--display);letter-spacing:-.025em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ob-row small{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ob-row .late{color:var(--bad);font-weight:600;}
  .ob-dots{display:inline-flex;gap:4px;}
  .ob-dots i{width:10px;height:10px;border-radius:50%;background:var(--g-soft,var(--line));box-shadow:inset 0 0 0 1px var(--line);}
  .ob-dots i.on{background:var(--accent);box-shadow:none;}
  .ob-rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .ob-rule{padding:18px 20px;border-radius:20px;border:1px solid var(--g-glass-line,var(--line));background:var(--g-glass,var(--card));}
  .ob-rule b{font:650 19px/1.1 var(--display);letter-spacing:-.03em;display:block;margin-bottom:6px;}
  .ob-rule p{font-size:14px;color:var(--mute);}
  .ob-foot{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:28px;font-size:13px;color:var(--mute);}

  /* Kopf eines Kunden */
  .ob-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px var(--pad);background:var(--g-glass-2,rgba(255,255,255,.85));-webkit-backdrop-filter:var(--g-blur,blur(16px));backdrop-filter:var(--g-blur,blur(16px));border-bottom:1px solid var(--g-glass-line,var(--line));}
  .ob-back{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1;}
  .ob-name{flex:0 1 210px;min-width:0;font:650 16px/1.1 var(--display);letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ob-steps{display:flex;gap:2px;margin:0 auto;padding:3px;border-radius:999px;background:var(--g-soft,rgba(35,35,33,.05));}
  .ob-step{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 5px;border:0;border-radius:999px;background:transparent;color:var(--mute);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background-color .2s ease,color .2s ease;}
  .ob-step i{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-style:normal;font-size:12px;font-weight:700;background:var(--card);color:var(--ink);}
  .ob-step.done i{background:var(--accent);color:#232321;}
  .ob-step[aria-current="step"]{background:#232321;color:#FEFEFE;}
  :root[data-theme="dark"] .ob-step[aria-current="step"]{background:#F3ECDD;color:#151211;}
  .ob-step[aria-current="step"] i{background:#FEFEFE;color:#232321;}
  :root[data-theme="dark"] .ob-step[aria-current="step"] i{background:#151211;color:#FEFEFE;}
  .ob-step:hover:not([aria-current="step"]){color:var(--ink);}

  /* Arbeitsfläche */
  .ob-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,420px);gap:clamp(18px,2.6vw,36px);max-width:1240px;margin:0 auto;padding:clamp(16px,2.4vw,28px) var(--pad) 48px;align-items:start;}
  .ob-card{padding:clamp(18px,2.6vw,30px);border-radius:26px;border:1px solid var(--g-glass-line,var(--line));background:var(--g-glass,var(--card));box-shadow:var(--g-shadow,none),var(--g-hi,none);-webkit-backdrop-filter:var(--g-blur,none);backdrop-filter:var(--g-blur,none);animation:ob-in .3s var(--ease);}
  @keyframes ob-in{from{transform:translateY(6px);}to{transform:none;}}
  .ob-card>h1{font:700 clamp(28px,3.6vw,40px)/1 var(--display);letter-spacing:-.04em;margin:8px 0 6px;}
  .ob-card>.ob-sub{color:var(--mute);font-size:15px;margin-bottom:22px;}
  .ob-fields{display:grid;gap:18px;}
  .ob-f{display:grid;gap:7px;min-width:0;}
  .ob-l{font-weight:620;font-size:14.5px;line-height:1.3;}
  .ob-h{font-size:12.5px;color:var(--mute);line-height:1.35;}
  .ob-f input,.ob-f textarea,.ob-f select{width:100%;padding:11px 14px;font-size:16px;font-weight:500;border-radius:14px;border:1px solid var(--line);background:var(--card);}
  .ob-f textarea{resize:none;overflow:hidden;line-height:1.4;min-height:48px;display:block;}
  .ob-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;}
  .ob-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .ob-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .ob-chip{display:inline-flex;align-items:center;min-height:36px;padding:7px 14px;border-radius:999px;border:1px solid var(--g-glass-line,var(--line));background:var(--g-glass-2,var(--card));box-shadow:0 1px 2px rgba(35,35,33,.05);font-size:14px;font-weight:550;line-height:1.15;text-align:left;transition:background-color .15s ease,color .15s ease;}
  .ob-chip:hover{background:var(--card);}
  .ob-chip[aria-pressed="true"]{background:#232321;border-color:#232321;color:#FEFEFE;}
  :root[data-theme="dark"] .ob-chip[aria-pressed="true"]{background:#F3ECDD;border-color:#F3ECDD;color:#151211;}
  .ob-chip.hot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#232321;}
  .ob-addchip{width:150px !important;min-height:36px;padding:6px 14px !important;font-size:14px !important;border-radius:999px !important;}
  .ob-more{border-top:1px solid var(--line);padding-top:14px;}
  .ob-more summary{cursor:pointer;font-weight:620;font-size:14px;color:var(--mute);list-style:none;display:flex;align-items:center;gap:8px;}
  .ob-more summary::-webkit-details-marker{display:none;}
  .ob-more summary::before{content:"+";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--g-soft,var(--line));font-size:14px;line-height:1;}
  .ob-more[open] summary::before{content:"−";}
  .ob-more .ob-fields{margin-top:14px;}
  .ob-tip{padding:11px 14px;border-radius:14px;background:var(--accent-tint);color:#232321;font-size:13.5px;line-height:1.38;}
  :root[data-theme="dark"] .ob-tip{background:rgba(242,106,33,.16);color:var(--ink);}
  .ob-num{display:flex;align-items:center;border-radius:14px;border:1px solid var(--g-glass-line,var(--line));background:var(--g-field,var(--card));height:46px;}
  .ob-num button{flex:none;width:40px;height:100%;border:0;background:none;font-size:18px;font-weight:500;color:var(--mute);}
  .ob-num button:hover{color:var(--ink);}
  .ob-num input{flex:1;min-width:0;width:100%;padding:0 !important;text-align:center;border:0 !important;background:none !important;box-shadow:none !important;font-weight:650;font-size:17px;-moz-appearance:textfield;appearance:textfield;}
  .ob-num input::-webkit-outer-spin-button,.ob-num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .ob-price{display:grid;grid-template-columns:minmax(0,180px) auto;gap:10px;align-items:center;}
  .ob-seg{display:inline-flex;justify-self:start;width:max-content;padding:3px;border-radius:999px;background:var(--g-soft,rgba(35,35,33,.05));gap:2px;max-width:100%;}
  .ob-seg button{border:0;background:none;min-height:34px;padding:6px 13px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--mute);white-space:nowrap;}
  .ob-seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(35,35,33,.1);}
  :root[data-theme="dark"] .ob-seg button[aria-pressed="true"]{background:rgba(255,245,235,.14);}
  .ob-zug{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
  .ob-zugb{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:7px 8px 7px 14px;border-radius:14px;border:1px solid var(--g-glass-line,var(--line));background:var(--g-glass-2,var(--card));font-size:14px;font-weight:550;text-align:left;}
  .ob-zugb span{flex:none;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--accent-tint);color:#8F3208;}
  .ob-zugb[data-s="da"] span{background:#DDF1E4;color:#1F7A4D;}
  .ob-zugb[data-s="nein"]{color:var(--mute);}
  .ob-zugb[data-s="nein"] span{background:var(--g-soft,var(--line));color:var(--mute);}
  .ob-given{display:grid;gap:7px;margin:0;padding:0;list-style:none;font-size:14px;}
  .ob-given li{padding-left:16px;position:relative;}
  .ob-given li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .ob-nav{display:flex;align-items:center;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);}
  .ob-miss{flex:1;min-width:0;font-size:13px;color:var(--mute);line-height:1.3;}
  .ob-miss b{color:var(--accent-ink);font-weight:650;}

  /* Schritt 5 */
  .ob-block{padding-top:18px;border-top:1px solid var(--line);display:grid;gap:10px;}
  .ob-block:first-of-type{padding-top:0;border-top:0;}
  .ob-blockh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .ob-blockh h2{font:650 19px/1.1 var(--display);letter-spacing:-.03em;margin:0;}
  .ob-check{display:grid;gap:2px;}
  .ob-checkb{display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;align-items:start;width:100%;text-align:left;padding:7px 4px;border:0;background:none;border-radius:10px;font-size:14.5px;font-weight:550;line-height:1.3;}
  .ob-checkb:hover{background:var(--g-soft,var(--line));}
  .ob-checkb i{width:20px;height:20px;margin-top:1px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;box-shadow:inset 0 0 0 1.5px var(--line-2);color:transparent;}
  .ob-checkb.ok i{background:var(--accent);box-shadow:none;color:#232321;}
  .ob-checkb small{display:block;font-size:12.5px;font-weight:500;color:var(--accent-ink);}
  .ob-terms{display:grid;gap:0;}
  .ob-term{display:grid;grid-template-columns:22px 142px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:550;}
  .ob-term:last-child{border-bottom:0;}
  .ob-term input[type="checkbox"]{width:18px;height:18px;margin:0;accent-color:#F26A21;}
  .ob-term input[type="date"]{width:100%;padding:6px 8px;font-size:13.5px;font-weight:550;border-radius:10px;border:1px solid var(--line);background:var(--card);}
  .ob-term.done span{color:var(--mute);text-decoration:line-through;}
  .ob-term.late input[type="date"]{color:var(--bad);}
  .ob-who{font-size:11.5px;font-weight:650;color:var(--mute);white-space:nowrap;}
  .ob-msg{width:100%;min-height:160px;padding:13px 15px;font-size:14.5px;line-height:1.45;border-radius:14px;border:1px solid var(--line);background:var(--card);resize:none;overflow:hidden;display:block;}
  .ob-acts{display:flex;flex-wrap:wrap;gap:6px;}
  .ob-todos{display:grid;gap:0;}
  .ob-todo{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.3;}
  .ob-todo:last-child{border-bottom:0;}
  .ob-todo input{width:18px;height:18px;margin:0;accent-color:#F26A21;}
  .ob-todo.done span{color:var(--mute);text-decoration:line-through;}

  /* Rechte Spalte: Startübersicht live */
  .ob-rail{position:sticky;top:72px;display:grid;gap:10px;}
  .ob-railh{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ob-docwrap{border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--g-shadow-lg,0 20px 40px -24px rgba(0,0,0,.35));}
  .ob-doc{--ink:#232321;box-sizing:border-box;width:794px;min-height:1122px;padding:42px 48px 34px;background:#fff;color:#232321;font:500 13.5px/1.42 var(--body);display:flex;flex-direction:column;gap:19px;zoom:var(--z,1);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .ob-d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
  .ob-d-head img{height:46px;width:auto;display:block;}
  .ob-d-kick{font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:#C4490F;}
  .ob-d-head .r{text-align:right;color:#6C6F68;font-size:12px;}
  .ob-d-h1{font:700 46px/.96 var(--display);letter-spacing:-.04em;}
  .ob-d-sub{color:#6C6F68;font-size:14px;margin-top:7px;}
  .ob-d-goal{background:#FDE3D2;border-radius:18px;padding:20px 24px;display:grid;gap:9px;}
  .ob-d-goal p{font:650 22px/1.18 var(--display);letter-spacing:-.025em;}
  .ob-d-goal small{font-size:13px;line-height:1.35;color:#4A3A2E;}
  .ob-d-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;}
  .ob-d-sec{display:grid;gap:6px;align-content:start;}
  .ob-d-sec+.ob-d-sec{margin-top:0;}
  .ob-d-stack{display:grid;gap:16px;align-content:start;}
  .ob-d-big{font:650 21px/1.15 var(--display);letter-spacing:-.025em;}
  .ob-d-ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;}
  .ob-d-ul li{position:relative;padding-left:13px;}
  .ob-d-ul li::before{content:"";position:absolute;left:0;top:.52em;width:6px;height:6px;border-radius:50%;background:#F26A21;}
  .ob-d-rows{display:grid;}
  .ob-d-row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;padding:5px 0;border-bottom:1px solid rgba(35,35,33,.1);}
  .ob-d-row b{font-weight:650;}
  .ob-d-row span:last-child{font-size:12px;color:#6C6F68;}
  .ob-d-foot{margin-top:auto;background:#232321;color:#FEFEFE;border-radius:18px;padding:16px 22px;display:flex;justify-content:space-between;gap:18px;font-size:13px;line-height:1.35;}
  .ob-d-foot b{font:650 17px/1.15 var(--display);letter-spacing:-.02em;display:block;}
  .ob-d-foot .r{text-align:right;}
  .ob-d-miss{color:#A9ABA5;font-style:normal;font-weight:500;}

  /* Spickzettel */
  .ob-panel{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(560px,100vw);display:flex;flex-direction:column;background:var(--g-solid,var(--card));border-left:1px solid var(--line);box-shadow:-30px 0 70px -40px rgba(35,25,15,.5);transform:translateX(102%);visibility:hidden;transition:transform .32s var(--ease),visibility .32s;}
  .ob-panel.on{transform:none;visibility:visible;}
  .ob-panelh{padding:16px 18px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line);}
  .ob-panelh .t{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ob-panelh h2{font:700 24px/1 var(--display);letter-spacing:-.04em;margin:0;}
  .ob-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px;}
  .ob-tabs::-webkit-scrollbar{display:none;}
  .ob-tabs button{flex:none;border:0;background:none;padding:7px 11px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mute);}
  .ob-tabs button[aria-selected="true"]{background:#232321;color:#FEFEFE;}
  :root[data-theme="dark"] .ob-tabs button[aria-selected="true"]{background:#F3ECDD;color:#151211;}
  .ob-panelb{flex:1;overflow-y:auto;padding:16px 18px 40px;display:grid;gap:14px;align-content:start;font-size:14.5px;}
  .ob-search{width:100%;padding:10px 16px;font-size:15px;border-radius:999px;border:1px solid var(--line);background:var(--card);}
  .ob-qa{padding-bottom:12px;border-bottom:1px solid var(--line);display:grid;gap:4px;}
  .ob-qa b{font-weight:650;}
  .ob-qa p{color:var(--ink);opacity:.82;line-height:1.42;}
  .ob-sheeth{font:650 17px/1.15 var(--display);letter-spacing:-.025em;margin-top:6px;}
  .ob-time{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}

  if(!k){var m=0;L.forEach(function(x){var r=/(\d+)$/.exec(x.nr||"");if(r)m=Math.max(m,+r[1]);});k={id:uid("k"),nr:"K-"+String(m+1).padStart(3,"0"),created:now,land:"Deutschland",pay:"14",quelle:"Über Social Bites gewonnen"};L.push(k);}
  function set(key,v){if(v&&!k[key])k[key]=v;}
  k.name=k.name||K.name.trim();if(status==="kunde"||!k.status)k.status=status;
  k.typ=K.paket==="pilot"?(k.typ||"sonst"):(K.paket||k.typ||"sonst");
  set("kontakt",K.kontakt);set("form",K.form);set("tel",K.tel);set("mail",K.mail);set("freigabe",K.freigabe);set("drive",K.drive);
  set("paket",PAKETE[K.paket]);set("start",K.paket==="opening"?"":K.start);set("opening",K.opening);set("budget",K.preis?eur(K.preis)+(K.preisart==="monat"?" im Monat":""):"");
  set("notiz",K.ziel3m?"Ziel: "+K.ziel3m:"");k.updated=now;store(KK,L);K.kid=k.id;return isNew;
}
function val(k,key){
  if(key==="formate")return k.formate&&k.formate.length;
  if(key==="erreichbar")return k.tel||k.mail;
  if(key==="umfang")return k.videos||k.drehtage;
  return k[key];
}
function missing(k,c){return c.need.filter(function(n){return !val(k,n[0]);}).map(function(n){return n[1];});}
function stepNeeds(k,s){return CHECK.filter(function(c){return c.s===s;}).reduce(function(a,c){return a.concat(missing(k,c));},[]);}
function stepDone(k,s){return s===4?!!k.sent:stepNeeds(k,s).length===0;}
function doneCount(k){var n=0;for(var i=0;i<5;i++)if(stepDone(k,i))n++;return n;}

/* Termine aus dem Playbook, einzelne Daten lassen sich überschreiben */
function termine(k){
  var pk=k.paket||"gastro",plan=PLAN[pk],t0=today(),rows=[],isOp=pk==="opening",a=parse(isOp?k.opening:k.start);
  if(!a)a=isOp?add(t0,70):work(add(t0,1));
  plan.forEach(function(r,i){
    var d=add(a,r[0]);if(r[1]!=="Opening")d=work(d);
    rows.push({key:pk+i,label:r[1],who:r[2],d:iso(d)});
  });
  if(isOp){
    var kick=rows[0];
    rows=rows.filter(function(r){return parse(r.d)>=t0||k.done[r.key]||k.ov[r.key];});
    if(rows.indexOf(kick)<0){kick.d=iso(work(add(t0,1)));rows.unshift(kick);}
  }
  rows.forEach(function(r){if(k.ov[r.key])r.d=k.ov[r.key];r.done=!!k.done[r.key];r.late=!r.done&&parse(r.d)<t0;});
  return rows.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});
}
function nextTermin(k){return termine(k).filter(function(r){return !r.done;})[0]||null;}

    {k:"check",t:"Selbst rausfinden: 3 Beobachtungen, 3 Wettbewerber, Profil Check",l:"Mitbewerber",go:"t-mitbewerber"},
    {k:"product",t:"Product Dashboard: was läuft, bis zu 100 Video Ideen",l:"Auftrag für Claude",a:"claude"},
    {k:"strategie",t:"Strategie auf einer Seite, Content und Drehplan",l:"Call Sheet",go:"t-callsheet"},
    {k:"crew",t:"Cutter mit einheitlichem Briefing, Kapazität und Vertretung geprüft",l:"Crew",go:"t-crew"},

}

  var a=[],m=k.preisart==="monat";

  return '<h3 class="ob-sheeth" style="margin-top:0">Wer wofür steht</h3><ul class="ob-ul"><li>Die Betreuung verantwortet Kundenziel, Konzept, Kommunikation und finale Abnahme.</li><li>Cutter bekommen ein einheitliches Briefing.</li><li>Jedes Video wird vor Übergabe geprüft: Inhalt, Schreibweise, Ton, Markenwirkung, vereinbarte Vorgaben.</li><li>Zusatzwünsche bekommen einen klaren Umfang und gegebenenfalls einen neuen Preis.</li><li>Kapazität und Vertretung vor jeder Zusage prüfen.</li><li>Für Ads, Influencer und Community ist geklärt, wer es tatsächlich umsetzt.</li><li>Beim Retainer müssen Planung, Betreuung und Auswertung in der Kalkulation stecken, sonst fehlt die Zeit für das, was wir versprechen.</li></ul>'+
    '<h3 class="ob-sheeth">Positive Überraschungen</h3><ul class="ob-ul"><li>Im Erstgespräch zwei Ideen zeigen, die er direkt mit seinem Unternehmen verbindet.</li><li>Vor dem Dreh genau erklären, was Mitarbeiter und Location vorbereiten müssen.</li><li>Kurze Statusmeldung, bevor der Kunde nachfragt.</li><li>Wiederkehrende Kundenfragen sammeln und daraus neue Inhalte entwickeln.</li><li>Im Monatsreview eine konkrete Entscheidung empfehlen: weiterführen, verändern, beenden.</li><li>Bei einem Problem sofort Auswirkung, Lösung und neuen Termin nennen.</li></ul>'+
    '<h3 class="ob-sheeth">Unterlagen und wofür</h3>'+[["Kurze Agenturpräsentation","Erklärt unseren Ansatz und zeigt passende Belege"],["Vorbereitungsblatt zum Kunden","Macht die Recherche systematisch"],["Zwei bis drei Referenzblätter","Belastbare Antworten auf Erfahrungsfragen"],["Verständliche Angebotsvorlage","Klärt Leistungen, Gesamtkosten und Mitwirkung"],["Willkommen und Startübersicht","Gibt direkt nach Auftrag Orientierung"],["Strategie auf einer Seite","Hält Ziel, Zielgruppe, Botschaft, Formate und Messung zusammen"],["Content- und Drehplan","Macht die Umsetzung planbar"],["Freigabeansicht","Verhindert verstreutes und widersprüchliches Feedback"],["Monatsreview","Zeigt, was wir gelernt haben und wie wir weiterarbeiten"]].map(function(u){return '<div class="ob-prep"><b>'+esc(u[0])+'</b><span>'+esc(u[1])+'</span></div>';}).join("")+
    '<h3 class="ob-sheeth">Das sieht der Kunde jederzeit</h3><ul class="ob-ul"><li>Wer ihn betreut.</li><li>Was gerade produziert wird.</li><li>Welche Freigabe von ihm benötigt wird.</li><li>Wann die nächste Lieferung erfolgt.</li><li>Wo Entwürfe und finale Dateien liegen.</li><li>Was im letzten Review entschieden wurde.</li></ul>';
}
function drawSheet(){
  var p=$("#obPanel");
  var y=$(".ob-panelb",p);var top=y?y.scrollTop:0;
  p.innerHTML='<div class="ob-panelh"><div class="t"><h2>Spickzettel</h2><button type="button" class="ob-back" data-act="sheetclose" aria-label="Schließen">×</button></div><div class="ob-tabs" role="tablist">'+TABS.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(SHEET===t[0])+'">'+t[1]+'</button>';}).join("")+'</div>'+(SHEET==="fragen"?'<input class="ob-search" id="obSearch" type="search" placeholder="Was fragt der Kunde?" aria-label="Kundenfrage suchen" value="'+esc(QUERY)+'">':"")+'</div><div class="ob-panelb" id="obPanelB">'+sheetBody()+'</div>';
  $(".ob-panelb",p).scrollTop=top;
}
function toggleSheet(on){var p=$("#obPanel");if(on){drawSheet();p.classList.add("on");p.setAttribute("aria-hidden","false");}else{p.classList.remove("on");p.setAttribute("aria-hidden","true");}}

/* ---------- Ereignisse ---------- */
document.addEventListener("submit",function(e){
  if(e.target.id==="obNew"){e.preventDefault();var n=$("#obNewName").value.trim();if(!n){$("#obNewName").focus();toast("Erst den Namen eintragen");return;}
    var ex=ALL.filter(function(x){return String(x.name).trim().toLowerCase()===n.toLowerCase();})[0];if(ex){open(ex.id);return;}
    var o=fromKunde(blank(n));ALL.unshift(o);saveNow();open(o.id,0);}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="obSearch"){QUERY=t.value;$("#obPanelB").innerHTML=sheetBody();return;}
  if(t.id==="obMsg"){K.msg=K.msg||{};K.msg[msgMode(K)]=t.value;grow(t);save();return;}
  if(t.dataset&&t.dataset.term){K.ov[t.dataset.term]=t.value;save();soft();return;}
  if(!t.dataset||!t.dataset.f||!K)return;
  var key=t.dataset.f;K[key]=t.value;if(t.tagName==="TEXTAREA")grow(t);save();soft();
});
document.addEventListener("change",function(e){
  var t=e.target;if(!K)return;
  if(t.dataset.f==="name"&&!K.kid){var had=K.vomStamm;fromKundeSoft();if(K.vomStamm&&!had)drawForm();}
  if(t.dataset.f==="start"||t.dataset.f==="opening"){K.ov={};save();var ts=$("#obTerms");if(ts)ts.innerHTML=termsHTML();soft();return;}
  if(t.dataset.done){K.done[t.dataset.done]=t.checked;save();t.closest(".ob-term").classList.toggle("done",t.checked);soft();return;}
  if(t.dataset.todo){K.todo[t.dataset.todo]=t.checked;save();t.closest(".ob-todo").classList.toggle("done",t.checked);}
});
function fromKundeSoft(){var keep=K.name;var k=findKunde(keep);if(!k)return;if(!K.kontakt&&!K.tel&&!K.mail&&!K.paket){fromKunde(K);save();}}
document.addEventListener("keydown",function(e){
  var t=e.target;
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"&&K){e.preventDefault();if(STEP<4)goStep(STEP+1);return;}
  if(e.key==="Escape"&&$("#obPanel").classList.contains("on")){toggleSheet(false);return;}
  if(e.key==="Enter"&&t.dataset&&t.dataset.addchip){e.preventDefault();var v=t.value.trim();if(!v)return;var key=t.dataset.addchip;K[key]=K[key]||[];if(K[key].indexOf(v)<0)K[key].push(v);save();drawForm('[data-addchip="'+key+'"]');soft();return;}
  if(e.key==="Enter"&&t.tagName==="INPUT"&&t.dataset&&t.dataset.f&&t.type!=="date"){e.preventDefault();var a=$$("#obForm input[data-f]:not([type=date]),#obForm textarea[data-f]"),i=a.indexOf(t);if(i>=0&&a[i+1])a[i+1].focus();else if(STEP<4)goStep(STEP+1);return;}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)){e.preventDefault();toggleSheet(true);}
});
document.addEventListener("click",function(e){
  var b=e.target.closest("button,a");if(!b)return;var d=b.dataset;
  if(d.open){open(d.open);return;}
  if(d.tab){SHEET=d.tab;drawSheet();return;}
  if(d.go){goPortal(d.go);return;}
  if(d.act&&ACT[d.act]){ACT[d.act](b);return;}
  if(!K)return;
  if(d.goto!=null&&d.goto!==""){goStep(+d.goto);return;}
  if(d.chip){var key=d.chip,v=d.v;
    if(Array.isArray(K[key])){var i=K[key].indexOf(v);if(i>=0)K[key].splice(i,1);else K[key].push(v);}
    else{K[key]=K[key]===v?"":v;}
    if(key==="branche"&&K.branche&&!K.mess)K.mess=BRANCHEN[K.branche].h;
    save();
    if(key==="branche"||key==="paket"||key==="anlass"){var y=window.scrollY;drawForm();window.scrollTo(0,y);}
    else if(Array.isArray(K[key])){var on=K[key].indexOf(v)>=0;b.setAttribute("aria-pressed",String(on));if(!on&&BRANCHEN&&key==="formate"){var y2=window.scrollY;drawForm();window.scrollTo(0,y2);}}
    else{$$('[data-chip="'+key+'"]').forEach(function(x){x.setAttribute("aria-pressed",String(K[key]===x.dataset.v));});}
    soft();return;}
  if(d.seg){K[d.seg]=d.v;save();var y3=window.scrollY;drawForm();window.scrollTo(0,y3);soft();return;}
  if(d.flag){K[d.flag]=!K[d.flag];b.setAttribute("aria-pressed",String(K[d.flag]));save();soft();return;}
  if(d.num){var n=(+K[d.num]||0)+(+d.d);K[d.num]=Math.max(0,n);var inp=$('input[data-f="'+d.num+'"]');if(inp)inp.value=K[d.num];save();soft();return;}
  if(d.zug){var cur=K.zug[d.zug]||"fehlt",nx=cur==="fehlt"?"da":cur==="da"?"nein":"fehlt";K.zug[d.zug]=nx;b.dataset.s=nx;$("span",b).textContent=({fehlt:"Fehlt",da:"Da",nein:"Entfällt"})[nx];save();soft();return;}
  if(d.mode){K.msgMode=d.mode;save();var y4=window.scrollY;drawForm();window.scrollTo(0,y4);soft();return;}
});
var ACT={
  home:function(){saveNow();location.hash="";},
  sheet:function(){toggleSheet(!$("#obPanel").classList.contains("on"));},
  sheetclose:function(){toggleSheet(false);},
  demo:demo,
  prev:function(){if(STEP>0)goStep(STEP-1);},
  next:function(){if(STEP<4)goStep(STEP+1);else finish();},
  pdf:printDoc,
  ics:ics,
  claude:claude,
  preview:function(){var dl=$("#obPrev");dl.innerHTML='<div class="ob-prevh"><span class="ob-eyebrow">Das bekommt der Kunde</span><button type="button" class="ob-back" data-act="previewclose" aria-label="Schließen">×</button></div><div id="obPrevWrap" class="ob-docwrap" style="border-radius:0 0 22px 22px">'+docHTML(K,true)+'</div>';dl.showModal();fitDoc();},
  previewclose:function(){$("#obPrev").close();},
  rechner:function(){if(!String(K.name||"").trim()){toast("Erst den Namen eintragen");return;}toKunde("gespraech");saveNow();window.open("rechner.html?kunde="+encodeURIComponent(K.kid),"_blank","noopener");},
  wa:function(){K.sent=true;saveNow();soft();var nr=digits(K.tel);window.open("https://wa.me/"+nr+"?text="+encodeURIComponent($("#obMsg").value),"_blank","noopener");},
  mail:function(){K.sent=true;saveNow();soft();location.href="mailto:"+encodeURIComponent(K.mail||"")+"?subject="+encodeURIComponent(betreff(K))+"&body="+encodeURIComponent($("#obMsg").value);},
  copy:function(){K.sent=true;saveNow();soft();copy($("#obMsg").value,"Nachricht kopiert");},
  msgreset:function(){delete K.msg[msgMode(K)];save();var y=window.scrollY;drawForm();window.scrollTo(0,y);soft();},
  del:function(){if(!confirm("„"+(K.name||"Dieses Onboarding")+"“ wirklich löschen? Der Kundenstamm bleibt unberührt."))return;var id=K.id;ALL=ALL.filter(function(x){return x.id!==id;});K=null;saveNow();location.hash="";toast("Gelöscht");},
  export:function(){dl(new Blob([JSON.stringify({art:"sb-onboarding",stand:new Date().toISOString(),daten:ALL},null,1)],{type:"application/json"}),"Social-Bites-Onboarding_"+iso(today())+".json");toast("Sicherung geladen");},
  import:function(){$("#obFile").click();}
};
$("#obFile").addEventListener("change",function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result),L=Array.isArray(j)?j:j.daten;if(!Array.isArray(L))throw 0;var n=0;
      L.forEach(function(o){if(!o||!o.id)return;var e=byId(o.id);if(!e){ALL.push(o);n++;}else if(String(o.updated)>String(e.updated)){ALL[ALL.indexOf(e)]=o;n++;}});
      saveNow();route();toast(n+" Einträge übernommen");}catch(e){toast("Die Datei passt nicht");}};
  r.readAsText(f);this.value="";
});
window.addEventListener("hashchange",route);
window.addEventListener("afterprint",function(){$("#obPrint").innerHTML="";});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(K)$$("textarea[data-f],#obMsg").forEach(grow);});
route();
})();
</script>
